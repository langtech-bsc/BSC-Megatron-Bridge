# Example YAML configuration for Llama 3.2 1B pretraining
# This file demonstrates commonly customized settings.
# Modify values as needed for your use case.

# Data configuration
dataset:
  blend:
  - - /home/bsc/bsc082280/data/roneneldan_TinyStories/tokenized_data/Qwen/Qwen3-8B/tinystories_text_document
  - - 1.0
  seq_length: 2048
  split: 95,4,1
  data_parallel_size: 4

# Tokenizer configuration
tokenizer:
  tokenizer_model: Qwen/Qwen3-8B

# Model configuration
# Note: seq_length must match dataset.seq_length
model:
  hf_model_id: "Qwen/Qwen3-8B"
  seq_length: 2048
  tensor_model_parallel_size: 4
  pipeline_model_parallel_size: 1
  context_parallel_size: 1
  
# Training configuration
train:
  train_iters: 1000
  micro_batch_size: 2
  global_batch_size: 32

# Validation configuration
validation:
  eval_iters: 5
  eval_interval: 1000

# Optimizer configuration
optimizer:
  lr: 0.0003
  min_lr: 0.00003
  weight_decay: 0.1

# Learning rate scheduler
scheduler:
  lr_warmup_iters: 2
  lr_decay_style: cosine

# Checkpoint configuration
checkpoint:
  #load: "/gpfs/scratch/bsc88/bsc082280/outputs/megatron-bridge/${oc.env:EXPERIMENT_DATETIME}/checkpoints" # Directory containing a model checkpoint
  #load_optim: True # Do not load optimizer when loading checkpoint
  save: "/gpfs/scratch/bsc88/bsc082280/outputs/megatron-bridge/${oc.env:EXPERIMENT_DATETIME}/checkpoints" # Directory to save checkpoints
  save_interval: 10000
  also_save_hf_checkpoint: False # export an additional HuggingFace artifact alongside each Megatron checkpoint
  #pretrained_checkpoint: /home/bsc/bsc082280/sym_folders/gpfs/scratch/bsc88/bsc082280/outputs/megatron-bridge/converted_checkpoints/hf_to_megatron/Qwen/Qwen3-8B/iter_0000000 # Directory containing a pretrained model checkpoint for finetuning.
  ckpt_format: 'torch_dist' # 'torch', 'torch_dist', 'torch_dcp', 'fsdp_dtensor'
  #ckpt_convert_save: "/gpfs/scratch/bsc88/bsc082280/outputs/megatron-bridge/${oc.env:EXPERIMENT_DATETIME}/converted_checkpoints" # Save directory for converted checkpoint.
  #hf_source_path: ? 

# Logging
logger:
  log_interval: 10
  log_throughput: True
  log_throughput_to_tensorboard: True
  log_timers_to_tensorboard: True
  tensorboard_dir: "/gpfs/scratch/bsc88/bsc082280/outputs/megatron-bridge/tensorboard"
  wandb_save_dir: "/gpfs/scratch/bsc88/bsc082280/outputs/megatron-bridge/wandb"
  wandb_project: megatron-experiments  # Uncomment to enable W&B logging
  wandb_exp_name: qwen3-8B-pretrain
  save_config_filepath: "/gpfs/scratch/bsc88/bsc082280/outputs/megatron-bridge/${oc.env:EXPERIMENT_DATETIME}/config.yaml"
  

# Random seed
rng:
  seed: 1234
